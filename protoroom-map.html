<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOROOM map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@700&display=swap" rel="stylesheet">

<!--
  PROTOROOM map — 한 문장에서 가지가 뻗어 나오는 마인드맵

  쓰는 법
  · 구절을 클릭하면 그 구절의 설명 문장이 선으로 이어져 뜨고 고정된다.
    고정된 구절이나 설명 문장을 다시 클릭하면 들어간다.
  · 화면 왼쪽 가장자리에 커서를 대면 조절 메뉴가 펼쳐진다.

  고치는 법
  · 문장·설명 문장 바꾸기  → 아래 <main> 의 [1] 본문
  · 크기 기본값 바꾸기      → 아래 <nav> 의 [2] 조절 메뉴 (각 슬라이더의 value)
  · 색·글꼴·애니메이션      → <style>
  · 가지가 놓이는 위치      → <script> 의 [C] 가지 배치
-->

<style>
/* ───────── 1. 바탕과 본문 글씨 ───────── */
:root {
  --bg:   #E8E8E6;   /* 바탕 */
  --ink:  #2346E8;   /* 글씨·선 */
  --mark: #FFE600;   /* 구절 노란 표시 */
  /* --main, --pop, --scale 은 조절 메뉴의 슬라이더가 넣는다 (스크립트 [A]) */
}
body {
  margin: 0;
  overflow: hidden;              /* 팝업이 커질 때 스크롤바가 깜빡이지 않게 */
  background: var(--bg);
  color: var(--ink);
  font: 700 18px/1.7 "Nanum Gothic", sans-serif;
  word-break: keep-all;
}

/* ───────── 2. 화면 배치: 문장을 화면 한가운데에 ───────── */
main {
  min-height: 100vh; box-sizing: border-box;   /* 여백까지 합쳐 정확히 화면 높이 → 세로 한가운데 */
  display: flex; flex-direction: column; justify-content: center;
  text-align: center;
  padding: 48px 56px;
  transform-origin: 0 0;         /* 줌아웃은 스크립트 [D] 가 transform 으로 건다 */
  transition: transform .45s ease;
}
@media (max-width: 860px) { main { padding: 24px 16px; } }

/* stage = 문장 한 줄 크기의 상자. 팝업과 선은 이 상자를 기준으로 놓인다 */
.stage { position: relative; align-self: center; }

/* ───────── 3. 본문 문장과 구절 ───────── */
p {
  margin: 0;
  font-weight: 700;
  font-size: calc(var(--main) * 1vw);   /* 창 폭에 비례 → 항상 한 줄 */
  white-space: nowrap;
  line-height: 1.2;
  letter-spacing: -.035em;
  transition: color .25s ease;
}
p.all-shown { color: #888; }
.stage.rollover p, .stage.rollover .pop { color: #888; }
.stage.rollover .t.hovered, .stage.rollover .pop.hovered { color: var(--ink); }
.t:hover, .t.on { background: var(--mark); }   /* 커서를 올렸거나(.t:hover) 고정된(.on) 구절 */
.exhibition-link { color: inherit; text-decoration: none; }
.exhibition-link:focus-visible { outline: 2px solid currentColor; }
[data-pop], .pop { cursor: pointer; }

/* ───────── 4. 가지: 선 + 팝업 문장 (위치는 스크립트 [C] 가 잡는다) ───────── */
.stage svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  overflow: visible; pointer-events: none;
}
line { stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 1; visibility: hidden; }
line.show { visibility: visible; animation: draw .3s ease-out; }
@keyframes draw { from { stroke-dashoffset: 1; } }   /* 구절에서 팝업 쪽으로 그어진다 */

/* 자리는 '다 커진 크기'로 잡아 두고, 처음 크기에서 튕기듯 커지는 건 애니메이션으로만 보여 준다 */
.pop {
  position: absolute; visibility: hidden;
  white-space: nowrap;           /* 팝업 문장은 한 줄 */
  padding: .15em .3em;
  line-height: 1.4;
  font-size: calc(var(--pop) * var(--scale) * 1px);
  transform-origin: top center;  /* 아래쪽 가지: 위에서 아래로 커진다 */
}
.pop.up { translate: 0 -100%; transform-origin: bottom center; }   /* 위쪽 가지: 아래에서 위로 */
.pop.show { visibility: visible; animation: pop .45s ease-out; }
@keyframes pop { from { scale: calc(1 / var(--scale)); } }

/* ───────── 5. 조절 메뉴: 평소엔 숨김, 왼쪽 가장자리(16px 띠)에 커서를 대면 펼침 ───────── */
nav {
  position: fixed; inset: 0 auto 0 0; z-index: 10;
  width: 230px; padding: 28px 20px;
  background: var(--bg); border-right: 1px solid;
  font-size: 13px; line-height: 1.55;
  transform: translateX(calc(-100% + 16px));
  transition: transform .25s ease;
}
nav:hover, nav:focus-within { transform: none; box-shadow: 8px 0 24px #0002; }
nav label { display: block; margin-bottom: 18px; }
nav input { accent-color: var(--ink); }
nav input[type=range] { display: block; width: 100%; }
</style>
</head>

<body>

<!-- [2] 조절 메뉴 — 슬라이더의 value 가 기본값이다. data-var 는 그 값이 들어갈 CSS 변수 이름 -->
<nav>
  <label>본문 크기 <output></output>
    <input type="range" data-var="--main" min="1" max="12" step="0.1" value="2.3"></label>   <!-- 창 폭의 % -->
  <label>팝업 크기 <output></output>
    <input type="range" data-var="--pop" min="10" max="80" step="1" value="27"></label>      <!-- 처음 뜰 때 px -->
  <label>팝업 확대 배율 <output></output>
    <input type="range" data-var="--scale" min="1" max="4" step="0.1" value="2"></label>     <!-- 다 커졌을 때 몇 배 -->
  <label><input type="checkbox" id="roll"> 롤오버로 띄우기</label>                            <!-- 켜면 커서만 올려도 뜬다 -->
</nav>

<!-- [1] 본문 — class="t" 는 노란 표시가 되는 구절, data-pop 은 그 구절에서 뻗어 나올 설명 문장.
     구절에 data-pop="..." 을 적기만 하면 가지가 하나 더 생긴다. 문장은 한 줄로 이어 써야 띄어쓰기가 그대로 나온다. -->
<main>
  <div class="stage">
    <p><span class="t" data-pop="데이터 크기를 체감하는 용도로 더 이상 유효하지 않은 단위">1KB라는 작은 크기의 데이터</span>로 <span class="t" data-pop="한줄에 계산 수식에서 노이즈에 가까운 소리로 번역한다.">사운드를 생성하는 장치</span>를 만들어 <span class="t" data-pop="그 안에서 유의미한 리듬을 찾아 선택하고 연주한다.">공연</span>하고 <a class="t exhibition-link" href="MatterMatters-pt.html#part-1" target="_parent">전시</a>했다.</p>
    <svg></svg>   <!-- 가지의 선이 그려지는 곳 -->
  </div>
</main>

<script>
/* ════════════════════════════════════════════════════════════════
   구성
   [A] 조절 메뉴   슬라이더 값 → CSS 변수
   [B] 준비        화면 요소, 상태, 숫자 설정
   [C] 가지 배치   팝업과 선이 놓일 자리 계산
   [D] 줌 맞춤     팝업이 화면을 넘으면 전체를 줄여 다 보이게
   [E] 그리기      어떤 팝업을 보일지 정하고 [C]·[D] 실행
   [F] 연결        구절마다 팝업·선을 만들고 클릭·롤오버를 잇는다
   ════════════════════════════════════════════════════════════════ */


/* ── [A] 조절 메뉴 ─────────────────────────────────────────────── */
for (const slider of document.querySelectorAll("nav input[type=range]")) {
  const apply = () => {
    document.documentElement.style.setProperty(slider.dataset.var, slider.value);   // 예: --pop = 27
    slider.previousElementSibling.value = slider.value;                             // 이름 옆에 현재 값 표시
  };
  slider.oninput = apply;
  apply();   // 처음 한 번: 슬라이더의 value 가 기본값이 된다
}


/* ── [B] 준비 ──────────────────────────────────────────────────── */
const main    = document.querySelector("main");
const stage   = main.querySelector(".stage");                   // 문장 상자. 아래 좌표는 모두 이 상자 왼쪽 위가 (0,0)
const svg     = stage.querySelector("svg");
const phrases = [...main.querySelectorAll("[data-pop]")];       // 설명 문장이 달린 구절들
const roll    = document.getElementById("roll");                // "롤오버로 띄우기" 체크박스

// 구절마다 스크립트가 붙여 두는 것:  .pop 팝업 문장 / .line 선 / .box 팝업 자리 [왼쪽, 위, 오른쪽, 아래]
// 구절의 class:  on = 클릭으로 고정됨 / off = 방금 고정을 풀었음(커서가 떠날 때까지 롤오버로 다시 뜨지 않게)

const EDGE      = 24;    // 화면 가장자리에 남길 여백(px)
const FIRST_GAP = 1.5;   // 첫 가지까지의 거리 = 문장 높이 × 이 값
const ROW_GAP   = 24;    // 같은 쪽 가지들 사이 세로 간격(px)
const LEAN      = .35;   // 선의 기울기: 세로 거리 × 이 값만큼 옆으로
const CLEAR     = 20;    // 팝업 끝과 선 사이에 띄울 거리(px)
const MIN_ZOOM  = .1;    // 이보다 작게는 줄이지 않는다

let hovered = null;                  // 지금 커서가 올라가 있는 구절
let camera  = { x: 0, y: 0, k: 1 };  // 화면 전체의 이동(x, y)과 배율(k). k = 1 이 원래 크기

const center = el => el.offsetLeft + el.offsetWidth / 2;                 // 요소의 가로 가운데
const clamp  = (v, min, max) => Math.max(min, Math.min(max, v));         // v 를 min~max 안으로

function setCamera(x, y, k) {
  camera = { x, y, k };
  main.style.transform = x === 0 && y === 0 && k === 1 ? "" : `translate(${x}px,${y}px) scale(${k})`;
}

// 이 구절의 팝업을 지금 보여야 하는가: 고정됐거나, 롤오버가 켜진 채 커서가 올라가 있거나
const isPinned    = el => el.classList.contains("on");
const isHoverOnly = el => el === hovered && roll.checked && !isPinned(el) && !el.classList.contains("off");
const isShown     = el => isPinned(el) || isHoverOnly(el);


/* ── [C] 가지 배치 ─────────────────────────────────────────────────
   · 구절 순서대로 아래, 위, 아래, 위 … 로 번갈아 놓는다.
   · 같은 쪽에서는 왼쪽 구절의 팝업을 가까이, 오른쪽 구절의 팝업을 한 줄씩 더 멀리 놓는다.
   · 가까운 팝업은 '다음 구절의 선'보다 왼쪽에서 끝나게 한다
     → 뒤 구절의 선이 앞 팝업의 글자를 지나지 않는다.
   · 화면을 넘는 만큼은 [D] 줌 맞춤이 해결한다.
   ───────────────────────────────────────────────────────────────── */
function placeBranches() {
  const W = stage.offsetWidth, H = stage.offsetHeight;
  const screenLeft  = EDGE - stage.offsetLeft;                  // 화면 좌우 끝을 stage 좌표로
  const screenRight = innerWidth - EDGE - stage.offsetLeft;

  for (const up of [0, 1]) {                                    // 0 = 아래쪽, 1 = 위쪽
    const side = phrases.filter((el, i) => i % 2 === up);
    let dy = H * FIRST_GAP;                                     // 문장에서 이 팝업까지의 세로 거리

    side.forEach((el, j) => {
      const w = el.pop.offsetWidth, h = el.pop.offsetHeight;
      const from = center(el);                                  // 선이 시작하는 곳(구절 가운데)
      const next = side[j + 1];                                 // 같은 쪽의 다음(오른쪽) 구절
      const lean = dy * LEAN;
      let left, to;                                             // left: 팝업 왼쪽 끝, to: 선이 닿는 곳

      if (next) {
        // 다음 구절의 선보다 왼쪽에서 끝나게. 선은 왼쪽으로 기울인다
        left = center(next) - CLEAR - w;
        to   = clamp(from - lean, left + CLEAR, left + w - CLEAR);
      } else {
        // 그쪽의 마지막 팝업. 선은 바깥쪽으로 기울이고, 팝업은 화면 안에 들어오게 하되 선 끝은 품게 한다
        const outward = j > 0 || from >= W / 2 ? 1 : -1;
        to   = from + outward * lean;
        left = clamp(to - w / 2, screenLeft, screenRight - w);
        left = clamp(left, to + CLEAR - w, to - CLEAR);
      }

      const lineStartY = up ? 0 : H;                            // 문장의 윗변 또는 아랫변
      const popY       = up ? -dy : H + dy;                     // 팝업이 문장을 향한 쪽 변

      el.pop.classList.toggle("up", !!up);
      el.pop.style.left = left + "px";
      el.pop.style.top  = popY + "px";
      el.line.setAttribute("x1", from); el.line.setAttribute("y1", lineStartY);
      el.line.setAttribute("x2", to);   el.line.setAttribute("y2", popY);
      el.box = [left, up ? popY - h : popY, left + w, up ? popY : popY + h];

      dy += h + ROW_GAP;                                        // 다음 팝업은 한 줄 더 멀리
    });
  }
}


/* ── [D] 줌 맞춤 ───────────────────────────────────────────────────
   문장과 보이는 팝업이 화면에 다 들어가면 원래 크기 그대로.
   넘치면 다 보일 만큼만 화면 전체를 줄인다. 줄이는 방식은 두 가지:
   · 보통           → 전체를 화면 한가운데에 맞춘다.
   · 롤오버로만 뜸  → 커서 밑의 지점을 붙잡은 채 줄인다.
                      (가운데로 옮기면 구절이 커서에서 빠져나가 팝업이 깜빡인다)
   ───────────────────────────────────────────────────────────────── */
function fitToScreen(e) {
  const shown = phrases.filter(el => el.pop.classList.contains("show"));
  const sx = stage.offsetLeft, sy = stage.offsetTop;

  // 문장 + 보이는 팝업을 모두 감싸는 상자 (화면 좌표, 줄이기 전 크기)
  const L = sx + Math.min(0, ...shown.map(el => el.box[0]));
  const T = sy + Math.min(0, ...shown.map(el => el.box[1]));
  const R = sx + Math.max(stage.offsetWidth,  ...shown.map(el => el.box[2]));
  const B = sy + Math.max(stage.offsetHeight, ...shown.map(el => el.box[3]));

  // 여백을 뺀, 실제로 쓸 수 있는 화면 범위
  const right = innerWidth - EDGE, bottom = innerHeight - EDGE;

  const fits = L >= EDGE && R <= right && T >= EDGE && B <= bottom;
  if (!shown.length || fits) return setCamera(0, 0, 1);

  if (!(e && hovered && isHoverOnly(hovered))) {
    // 가운데 맞춤
    const k = Math.min(1, (right - EDGE) / (R - L), (bottom - EDGE) / (B - T));
    return setCamera(innerWidth / 2 - k * (L + R) / 2, innerHeight / 2 - k * (T + B) / 2, k);
  }

  // 커서 붙잡고 줄이기: 커서 밑 지점(px, py)이 줄인 뒤에도 커서 위치(x, y)에 오도록
  const x = e.clientX, y = e.clientY;
  const px = (x - camera.x) / camera.k, py = (y - camera.y) / camera.k;
  let k = 1;
  if (px > L) k = Math.min(k, (x - EDGE) / (px - L));     // 왼쪽 끝이 화면 안으로
  if (R > px) k = Math.min(k, (right - x) / (R - px));    // 오른쪽 끝
  if (py > T) k = Math.min(k, (y - EDGE) / (py - T));     // 위쪽 끝
  if (B > py) k = Math.min(k, (bottom - y) / (B - py));   // 아래쪽 끝
  k = Math.max(k, MIN_ZOOM);
  setCamera(x - px * k, y - py * k, k);
}


/* ── [E] 그리기 ────────────────────────────────────────────────────
   상태가 바뀔 때마다(클릭, 커서 드나듦) 부른다. e 는 그때의 마우스 이벤트. */
function render(e) {
  placeBranches();
  const rollover = hovered;
  stage.classList.toggle("rollover", !!rollover);
  for (const el of phrases) {
    el.classList.toggle("hovered", !!rollover && el === hovered);
    el.pop.classList.toggle("hovered", !!rollover && el === hovered);
    el.pop.classList.toggle("show", isShown(el));
    el.line.classList.toggle("show", isShown(el));
  }
  stage.querySelector("p").classList.toggle("all-shown", phrases.length > 0 && phrases.every(isShown));
  fitToScreen(e);
}


/* ── [F] 연결 ──────────────────────────────────────────────────── */
for (const el of phrases) {
  // 팝업 문장과 선을 만들어 둔다(처음엔 숨김)
  el.pop = document.createElement("div");
  el.pop.className = "pop";
  el.pop.textContent = el.dataset.pop;
  stage.appendChild(el.pop);

  el.line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  el.line.setAttribute("pathLength", 1);   // 선 길이를 1 로 쳐서, 긋는 애니메이션이 길이에 상관없이 같게
  svg.appendChild(el.line);

  // 커서가 드나들 때
  el.onmouseenter = e => { hovered = el; render(e); };
  el.onmouseleave = e => { hovered = null; el.classList.remove("off"); render(e); };

  // 구절 클릭: 고정 ↔ 해제
  el.onclick = e => {
    const pinned = el.classList.toggle("on");
    el.classList.toggle("off", !pinned);   // 해제했으면, 커서가 아직 위에 있어도 바로 들어가게
    render(e);
  };

  // 팝업 문장 클릭: 해제
  el.pop.onclick = e => { el.classList.remove("on"); render(e); };
}
window.addEventListener("resize", () => render());
document.querySelector("nav").addEventListener("input", () => render());
document.fonts.ready.then(() => render());

// 발표 안의 프레임에서만 이동 키를 부모 화면에 전달한다.
if (window.parent !== window) {
  document.querySelector(".exhibition-link").addEventListener("click", e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    window.parent.postMessage({ type: "matter-map-exhibition" }, "*");
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest?.("input, textarea, select, button, [contenteditable]")) return;
    let direction = 0;
    if (e.key === " " || e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown") direction = e.key === " " && e.shiftKey ? -1 : 1;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") direction = -1;
    if (direction) {
      e.preventDefault();
      window.parent.postMessage({ type: "matter-map-navigation", direction }, "*");
    } else if (e.key.toLowerCase() === "g") {
      window.parent.postMessage({ type: "matter-map-command", key: e.key.toLowerCase() }, "*");
    }
  });
}
</script>
</body>
</html>
