@font-face{font-family:"Plex KR";font-weight:700;src:url(../SyncSlide-Matters-Perform/public/fonts/ibm-plex-sans-kr-korean-700-normal.woff2) format("woff2")}

section.ch{padding:56px 0 8px;border-bottom:1px solid var(--line)}

th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{font-size:12px;color:var(--mute);font-weight:700}
td.y{color:var(--red);font-weight:700;text-align:center} td.n{color:var(--line);text-align:center}

<body>

<nav></nav>

<main id="top"></main>

<script>
// ───────── workbook.md → 화면 ─────────
// 내용은 전부 workbook.md 에 있다. 이 스크립트는 그 파일을 읽어 아래 표기 규칙대로 화면을 만든다.
// 표기 규칙은 README.md 참고.
const MD_FILE = "workbook.md";

const escText = s => s.replace(/&(?!#?\w+;)/g, "&amp;").replace(/<(?!\/?[a-zA-Z][^<>]*>)/g, "&lt;");
const escAll = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const escAttr = s => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;");

// 줄 안 표기: `코드`  **굵게**  ==빨강 강조==  [글자](주소)  + <small> <em> 같은 HTML 태그는 그대로
function inline(src) {
  const keep = [];
  const hold = html => "\u0000" + (keep.push(html) - 1) + "\u0000";
  let s = src.replace(/`([^`]+)`/g, (_, c) => hold("<code>" + escAll(c) + "</code>"));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => hold(`<a href="${escAttr(u)}">` + inline(t) + "</a>"));
  s = escText(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/==(.+?)==/g, '<b class="red">$1</b>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]);
}

// "키: 값" 줄 (제목 바로 아래에 붙는 정보)
const META = /^(목차|부제|키워드|회고):\s*(.*)$/;
const blockHTML = b => typeof b === "string" ? b
  : `<${b.tag}${b.cls.length ? ` class="${b.cls.join(" ")}"` : ""}${b.attr || ""}>${b.inner}</${b.tag}>`;
const classesOf = s => s.split(/\s+/).filter(c => c.startsWith(".")).map(c => c.slice(1));

function renderWorkbook(md) {
  const L = md.replace(/\r\n?/g, "\n").split("\n");
  let i = 0, title = "";
  if (L[0] === "---") {                                   // 맨 위 --- 사이: 문서 정보
    for (i = 1; i < L.length && L[i] !== "---"; i++) { const m = L[i].match(/^title:\s*(.*)$/); if (m) title = m[1]; }
    i++;
  }
  const main = [], nav = [], retroRows = [];
  let chapter = null, slot = null, retroAt = -1;

  const here = () => (slot || chapter || { blocks: main }).blocks;
  const closeSlot = () => {
    if (!slot) return;
    const s = slot; slot = null;
    const body = s.blocks.map(blockHTML).join("\n");
    if (s.kind === "warn") here().push(`<div class="warn">${body}</div>`);
    else here().push(`<div class="slot${s.cls ? " " + s.cls : ""}"><h4>${s.h4}</h4>${body}</div>`);
  };
  const closeChapter = () => {
    closeSlot();
    if (!chapter) return;
    const c = chapter; chapter = null;
    const no = c.no ? `<span class="no">${c.no}</span>` : "";
    const kw = c.kw ? `<div class="kw">${c.kw.split(/,\s*/).map(k => {
      const m = k.match(/^\*\*(.+)\*\*$/);
      return `<span class="k${m ? " m" : ""}">${inline(m ? m[1] : k)}</span>`;
    }).join("")}</div>` : "";
    main.push(`<section class="ch" id="${c.id}">\n<h3>${no}${inline(c.title)}</h3>\n${kw}\n${c.blocks.map(blockHTML).join("\n")}\n</section>`);
    if (c.retro) retroRows.push([c, ...c.retro.split(/\s*\|\s*/)]);
  };
  const readMeta = () => { const m = {}; let x; while (i < L.length && (x = L[i].match(META))) { m[x[1]] = x[2]; i++; } return m; };
  const heading = line => {                               // "제목 {#id}" → [제목, id]
    const m = line.match(/^(.*?)\s*\{#([\w-]+)\}\s*$/);
    return m ? [m[1], m[2]] : [line.trim(), ""];
  };
  const untilFence = () => { const a = []; while (i < L.length && L[i].trim() !== ":::") a.push(L[i++]); i++; return a.filter(x => x.trim()); };

  while (i < L.length) {
    const line = L[i];
    if (!line.trim()) { i++; continue; }

    // ── 표지
    if (line.startsWith("::: cover")) {
      i++; const rows = untilFence(), f = {}, groups = [];
      for (const r of rows) {
        let m;
        if ((m = r.match(/^(제목|기관|부제):\s*(.*)$/))) f[m[1]] = m[2];
        else if ((m = r.match(/^\[(.+)\]$/))) groups.push({ big: m[1], items: [] });
        else if ((m = r.match(/^- (.*?)\s*\|\s*(.*)$/))) groups.at(-1).items.push(m);
      }
      const br = s => inline(s || "").replace(/\s*\/\s*/g, "<br>");
      main.push(`<header class="cover">
<div class="c-top"><h1>${br(f["제목"])}</h1><div class="c-org">${br(f["기관"])}</div></div>
<div class="c-sub">${inline(f["부제"] || "")}</div>
${groups.map((g, n) => `<div class="c-row"><div class="c-big">${inline(g.big).replace("–", '<span style="margin:0 .12em">–</span>')}</div>
<div class="c-list">${g.items.map(m => `<div><span>${inline(m[1])}</span>${inline(m[2])}</div>`).join("")}${n === groups.length - 1 ? LEGEND : ""}</div></div>`).join("\n")}
</header>`);
      continue;
    }

    // ── # 부(部)   "# PART Ⅰ | 맥락"
    if (/^# /.test(line)) {
      closeChapter(); i++;
      const [text, id] = heading(line.slice(2));
      const [small, h2] = text.includes("|") ? text.split(/\s*\|\s*/) : ["", text];
      const m = readMeta();
      const head = `<small>${inline(small)}</small><h2>${inline(h2)}</h2>` + (m["부제"] ? `<div class="big">${inline(m["부제"])}</div>` : "");
      if (id === "retro") {                               // 회고: 표는 각 장의 "회고:" 줄과 "주제의식"에서 자동으로 만든다
        let thesis = "";
        while (i < L.length && !L[i].trim()) i++;
        if (L[i] && L[i].startsWith("::: thesis")) {
          i++; const t = untilFence();
          thesis = `<div class="thesis">${inline(t[0] || "").replace(/\s*\/\s*/g, "<br>")}</div>` + t.slice(1).map(p => `<p class="thesis-sub">${inline(p)}</p>`).join("");
        }
        retroAt = main.length;
        main.push(`<div class="part">${head}${thesis}</div>`);
        nav.push(`<a href="#retro">${inline(m["목차"] || h2)}</a>`);
      } else {
        main.push(`<div class="part">${head}</div>`);
        nav.push(`<b>${inline(m["목차"] || h2)}</b>`);
      }
      continue;
    }

    // ── ## 장   "## 01 제목"  또는  "## 제목 {#id}"
    if (/^## /.test(line)) {
      closeChapter(); i++;
      const [text, id] = heading(line.slice(3));
      const n = text.match(/^(\d\d)\s+(.*)$/);
      const m = readMeta();
      chapter = { no: n ? n[1] : "", title: n ? n[2] : text, id: id || (n ? "c" + n[1] : ""), kw: m["키워드"], retro: m["회고"], blocks: [], theme: "" };
      nav.push(`<a href="#${chapter.id}">${chapter.no ? chapter.no + " " : ""}${inline(m["목차"] || chapter.title)}</a>`);
      continue;
    }

    // ── ### 칸
    if (/^### /.test(line)) {
      closeSlot(); i++;
      const t = line.slice(4).trim();
      if (t === "확인 필요") { slot = { kind: "warn", blocks: [] }; continue; }
      const th = t.match(/^주제의식(?:\s*\((.+)\))?$/);
      slot = { kind: th ? "주제의식" : t, blocks: [], h4: th ? "주제의식" + (th[1] ? ` <em>${inline(th[1])}</em>` : "") : inline(t),
        cls: th ? "theme" : { "핵심 내용": "points", "영상": "vslot", "출처": "src" }[t] || "" };
      continue;
    }

    const out = here(), kind = slot ? slot.kind : "";

    // ── {.클래스} 한 줄: 바로 앞 덩어리에 클래스 붙이기
    if (/^\{[^}]*\}$/.test(line.trim())) {
      const b = out.at(-1); if (b && typeof b !== "string") b.cls.push(...classesOf(line.trim().slice(1, -1)));
      i++; continue;
    }

    // ── ::: lens / ::: chain
    if (line.startsWith("::: lens")) {
      const h = line.slice(8).trim(); i++;
      const items = untilFence().map(r => r.replace(/^\d+\.\s*/, "").match(/^\*\*(.+?)\*\*\s*(.*)$/));
      main.push(`<div class="lens"><h4>${inline(h)}</h4><ol>${items.map(m => `<li><b>${inline(m[1])}</b><small>${inline(m[2])}</small></li>`).join("")}</ol></div>`);
      continue;
    }
    if (line.startsWith("::: chain")) {
      i++;
      const steps = untilFence().map(r => r.replace(/^- /, "").split(/\s*\|\s*/));
      out.push(`<div class="chain">${steps.map(([s, t]) => `<div class="step"><small>${inline(s)}</small>${inline(t)}</div>`).join('<span class="arr">→</span>')}</div>`);
      continue;
    }

    // ── ``` 수식 블록
    if (line.startsWith("```")) {
      i++; const a = [];
      while (i < L.length && !L[i].startsWith("```")) a.push(L[i++]);
      i++;
      out.push(`<div class="formula">${escAll(a.join("\n")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</div>`);
      continue;
    }

    // ── > 인용  /  > [!확인] 확인 필요
    if (line.startsWith(">")) {
      const a = [];
      while (i < L.length && L[i].startsWith(">")) a.push(L[i++].replace(/^>\s?/, ""));
      const w = a[0].match(/^\[!확인\]\s*(.*)$/);
      if (w) { out.push(`<div class="warn">${inline([w[1], ...a.slice(1)].join(" ").trim())}</div>`); continue; }
      let cite = "";
      if (/^— /.test(a.at(-1))) cite = `<cite>${inline(a.pop().slice(2))}</cite>`;
      out.push({ tag: "blockquote", cls: [], inner: inline(a.join(" ")) + cite });
      continue;
    }

    // ── | 표 |
    if (line.startsWith("|")) {
      const rows = [];
      while (i < L.length && L[i].startsWith("|")) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
      const body = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r.trim())).map((r, n) => "<tr>" + cells(r).map(c =>
        n === 0 ? `<th>${inline(c)}</th>` : `<td${c === "●" ? ' class="y"' : c === "–" ? ' class="n"' : ""}>${inline(c)}</td>`).join("") + "</tr>");
      out.push({ tag: "table", cls: [], inner: body.join("\n") });
      continue;
    }

    // ── ![설명](그림 "캡션") 이 이어지면 그림 묶음
    if (line.startsWith("![")) {
      const figs = [];
      for (let m; i < L.length && (m = L[i].match(/^!\[(.*?)\]\((\S+)(?:\s+"(.*)")?\)\s*(\{[^}]*\})?\s*$/)); i++) {
        const c = m[4] ? classesOf(m[4].slice(1, -1)) : [];
        figs.push(`<figure><img${c.length ? ` class="${c.join(" ")}"` : ""} src="${escAttr(m[2])}" alt="${escAttr(m[1])}" loading="lazy"><figcaption>${inline(m[3] || "")}</figcaption></figure>`);
      }
      if (figs.length) { out.push({ tag: "div", cls: ["gal"], inner: figs.join("\n") }); continue; }
    }

    // ── 목록  "- "  /  "1. "
    const li = /^(-|\d+\.)\s+(.*)$/;
    if (li.test(line)) {
      const ordered = /^\d/.test(line), items = [];
      while (i < L.length && li.test(L[i])) items.push(L[i++].match(li)[2]);
      if (kind === "영상") {                               // - [제목](영상 주소) — 메모 ![](썸네일)
        const v = items.map(it => {
          const m = it.match(/^\[(.+?)\]\((\S+?)\)(?:\s+—\s+(.*?))?(?:\s*!\[\]\((\S+)\))?$/);
          if (!m) return "";
          const yt = m[2].match(/(?:v=|youtu\.be\/)([\w-]+)/), vm = m[2].match(/vimeo\.com\/(\d+)/);
          const thumb = m[4] || (yt ? `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg` : "");
          return `<a class="vid" target="_blank" rel="noopener" href="${escAttr(m[2])}" data-p="${yt ? "yt" : "vm"}" data-id="${yt ? yt[1] : vm ? vm[1] : ""}"><div class="th" style="background-image:url('${escAttr(thumb)}')"><span class="tag">${yt ? "YOUTUBE" : "VIMEO"}</span></div><div class="tx">${escAll(m[1])}<small>${escAll(m[3] || "")}</small></div></a>`;
        });
        out.push({ tag: "div", cls: ["vids", ...(v.length === 1 ? ["one"] : [])], inner: v.join("") });
      } else if (kind === "파일") {                         // 경로로 시작하면 링크, 아니면 메모 줄
        out.push({ tag: "div", cls: ["files"], inner: items.map(it => {
          const m = it.match(/^((?:\.\.?\/|https?:)\S*)(.*)$/);
          return m ? `<a href="${escAttr(m[1])}">${escAll(m[1])}</a>${escAll(m[2])}` : `<span>${escAll(it)}</span>`;
        }).join("\n") });
      } else if (items.every(it => / :: /.test(it))) {     // - 이름 :: 설명  → 정보 표
        out.push({ tag: "dl", cls: ["info"], inner: items.map(it => { const [k, ...v] = it.split(" :: "); return `<dt>${inline(k)}</dt><dd>${inline(v.join(" :: "))}</dd>`; }).join("\n") });
      } else {
        out.push({ tag: ordered ? "ol" : "ul", cls: kind === "핵심 내용" ? [] : ["flow"], inner: items.map(it => `<li>${inline(it)}</li>`).join("\n") });
      }
      continue;
    }

    // ── 문단 (끝에 {.say} 처럼 클래스를 붙일 수 있다)
    const para = [];
    while (i < L.length && L[i].trim() && !/^(#{1,3} |:::|```|>|\||!\[|(-|\d+\.)\s|\{[^}]*\}$)/.test(L[i])) para.push(L[i++].trim());
    if (!para.length) { para.push(L[i++].trim()); }        // 어떤 규칙에도 안 맞는 줄은 문단으로
    let text = para.join(" "), cls = [];
    const am = text.match(/\s*\{([^}]*)\}$/);
    if (am) { cls = classesOf(am[1]); text = text.slice(0, am.index); }
    if (kind === "warn" || kind === "출처") out.push(inline(text));
    else if (kind === "파일") out.push({ tag: "div", cls: ["files"], inner: escAll(text) });
    else {
      if (kind === "주제의식" && chapter && !chapter.theme) chapter.theme = inline(text);
      out.push({ tag: "p", cls, inner: inline(text) });
    }
  }
  closeChapter();

  if (retroAt >= 0) main[retroAt] = `<section id="retro" class="retro">${main[retroAt]}
<table class="retro-t"><tr><th>장 · 날짜</th><th>동사</th><th>주제의식</th></tr>
<tbody id="retro-rows">${retroRows.map(([c, verb, date]) => `<tr><td><a href="#${c.id}"><b>${c.no}</b></a><small>${inline(date || "")}</small></td><td><b>${inline(verb || "")}</b></td><td>${c.theme}</td></tr>`).join("")}</tbody>
</table></section>`;

  if (title) document.title = title;
  document.querySelector("nav").innerHTML = `<a href="#top"><strong>${escAll(title)}</strong></a>\n` + nav.join("\n");
  document.querySelector("main").innerHTML = main.join("\n\n");
}

// 표지 아래 범례 (내용이 아니라 화면 안내라서 여기에 둔다)
const LEGEND = `<div class="legend"><span class="k m">장 대표 키워드</span><span class="k">보조 키워드</span><span class="warn" style="padding:4px 10px">출처끼리 어긋나는 곳</span></div>`;

// ───────── 화면이 만들어진 뒤 붙는 동작 ─────────
function enhance() {
  // 영상: 썸네일 클릭 → 그 자리에서 재생 / 제목 클릭 → 새 탭
  document.querySelectorAll("a.vid").forEach(a => {
    const p = a.dataset.p, id = a.dataset.id;
    a.addEventListener("click", ev => {
      const th = ev.target.closest(".th");
      // YouTube는 file:// 에서 임베드 오류(153) → 로컬 서버(http)로 열 때만 제자리 재생, 아니면 새 탭
      if (!th || !id || (p === "yt" && !location.protocol.startsWith("http"))) return;
      ev.preventDefault();
      const f = document.createElement("iframe");
      f.src = p === "yt" ? `https://www.youtube.com/embed/${id}?autoplay=1` : `https://player.vimeo.com/video/${id}?autoplay=1`;
      f.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media"; f.allowFullscreen = true;
      f.style.cssText = "display:block;width:100%;aspect-ratio:16/9;border:0";
      th.replaceWith(f);
    });
  });

  // 핵심만 펼치고 나머지는 "원자료"로 접기 (지우지 않음)
  const KEEP = ["기본 정보", "영상", "주제의식", "핵심 내용", "질문 초안"];
  document.querySelectorAll("section.ch").forEach(sec => {
    if (!sec.querySelector(".kw")) return; // 부록은 그대로
    const moved = [...sec.children].filter(el =>
      el.classList.contains("warn") ||
      (el.classList.contains("slot") && !KEEP.some(k => el.querySelector("h4")?.textContent.includes(k))));
    if (!moved.length) return;
    const d = document.createElement("details");
    d.className = "raw";
    d.innerHTML = `<summary>원자료 <span>${moved.length}</span></summary>`;
    d.append(...moved);
    sec.append(d);
  });

  // 스페이스바: 다음 섹션 / Shift+스페이스: 이전 섹션
  document.addEventListener("keydown", e => {
    if (e.key !== " " || e.target.closest?.("input,textarea,select,button,summary,[contenteditable]")) return;
    e.preventDefault();
    const secs = [...document.querySelectorAll("header.cover, main > section")];
    const top = el => el.getBoundingClientRect().top;
    const t = e.shiftKey ? secs.filter(s => top(s) < -5).pop() : secs.find(s => top(s) > 5);
    if (t) t.scrollIntoView({ behavior: "smooth" });
  });

  // 표지 타이틀: 글자에서 피어오르는 연기 (WebGL 셰이더 — 노이즈가 위로 흐르며 글자 모양을 끌어올림, 군데군데 글자 앞을 지남)
  (() => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const h1 = document.querySelector(".cover h1"), host = h1.closest("header");
    const cv = document.createElement("canvas"), gl = cv.getContext("webgl", { premultipliedAlpha: true });
    if (!gl) return;
    const UP = 240, SIDE = 140, SC = .5;            // SC: 해상도 배율 (연기는 부드러워서 절반이면 충분)
    const ALPHA = .3, RISE = 150, SPEED = .35;     // 진하기(최대) · 오르는 높이(px) · 흐르는 속도
    const CYCLE = 14, MIN = .12;                    // 연기 양 주기(초): 적게 → 점점 많이 → 다시 적게, MIN = 가장 적을 때 비율
    host.style.position = "relative";
    cv.style.cssText = "position:absolute;pointer-events:none;z-index:2";
    host.append(cv);

    const fs = `precision mediump float;
    uniform sampler2D m; uniform vec2 res; uniform float t, A, R, S; uniform vec3 col;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+17.;a*=.5;}return v;}
    void main(){
      vec2 px=gl_FragCoord.xy, q=px/(90.*S);
      vec2 w=vec2(fbm(q*1.1+vec2(0.,-t)), fbm(q*1.1+vec2(5.2,1.3-t)))-.5;
      float d=0.;
      for(int i=0;i<24;i++){                 /* 아래(글자) 쪽을 거슬러 올라가며 연기 밀도 모으기 */
        float k=float(i)/24., off=k*R*S;
        d+=texture2D(m,(px-vec2(w.x*off*1.6,off))/res).a*(1.-k);
      }
      d/=7.;
      d*=smoothstep(.38,.78,fbm(q*2.4+w*2.5+vec2(0.,-t*1.4)));  /* 가닥 모양 */
      /* 글자 위를 지나는 연기: 느린 노이즈로 군데군데만 '앞'에 보이게 (밝은 김) — 나머지는 글자 뒤로 */
      float inside=smoothstep(.45,.9,texture2D(m,px/res).a);
      float front=smoothstep(.48,.62,fbm(q*.7+vec2(3.1,-t*.6)));
      float a=clamp(d*A*mix(1.,front*1.4,inside),0.,1.);
      vec3 c=mix(col,vec3(.96,.96,.95),inside);
      gl_FragColor=vec4(c*a,a);
    }`;
    const vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}";
    const prog = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(sh)); cv.remove(); return; }
      gl.attachShader(prog, sh);
    }
    gl.bindAttribLocation(prog, 0, "p"); gl.linkProgram(prog); gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const U = k => gl.getUniformLocation(prog, k);
    const [r0, g0, b0] = getComputedStyle(h1).color.match(/\d+/g).map(v => v / 255);
    gl.uniform3f(U("col"), r0, g0, b0); gl.uniform1f(U("A"), ALPHA); gl.uniform1f(U("R"), RISE); gl.uniform1f(U("S"), SC);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
      gl.texParameteri(gl.TEXTURE_2D, k, v);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

    // 글자 모양(살짝 흐리게)을 텍스처로 — 연기의 출발점
    function layout() {
      const hb = host.getBoundingClientRect(), r = h1.getBoundingClientRect();
      const W = r.width + SIDE * 2, H = r.height + UP;
      Object.assign(cv.style, { left: r.left - hb.left - SIDE + "px", top: r.top - hb.top - UP + "px", width: W + "px", height: H + "px" });
      cv.width = W * SC | 0; cv.height = H * SC | 0;
      const mk = document.createElement("canvas"); mk.width = cv.width; mk.height = cv.height;
      const c = mk.getContext("2d"), cs = getComputedStyle(h1);
      c.scale(SC, SC); c.filter = "blur(3px)";
      c.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; c.letterSpacing = cs.letterSpacing;
      for (const n of h1.childNodes) {
        const t = n.nodeType === 3 && n.textContent.trim(); if (!t) continue;
        const rg = document.createRange(); rg.selectNodeContents(n);
        const lr = rg.getClientRects()[0], txt = t.toUpperCase(), m = c.measureText(txt);
        c.fillText(txt, lr.left - r.left + SIDE, lr.top - r.top + UP + (lr.height - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 + m.fontBoundingBoxAscent);
      }
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mk);
      gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(U("res"), cv.width, cv.height);
    }
    let raf = 0, ready = false;
    function tick(now) {
      if (ready) {
        const ph = now / 1000 % CYCLE / CYCLE, ease = x => x * x * (3 - 2 * x);
        const env = ph < .7 ? ease(ph / .7) : ph < .85 ? 1 : 1 - ease((ph - .85) / .15); // 70% 동안 차오르고, 잠시 유지, 15% 동안 줄어듦
        gl.uniform1f(U("A"), ALPHA * (MIN + (1 - MIN) * env));
        gl.uniform1f(U("t"), now / 1000 * SPEED); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      raf = requestAnimationFrame(tick);
    }
    new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !raf) raf = requestAnimationFrame(tick);
      else if (!e.isIntersecting && raf) { cancelAnimationFrame(raf); raf = 0; }
    }).observe(h1);
    let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 200); });
    document.fonts.ready.then(() => { layout(); ready = true; });
  })();
}

(async () => {
  try {
    const res = await fetch(MD_FILE, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    renderWorkbook(await res.text());
    enhance();
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  } catch (e) {
    document.querySelector("main").innerHTML = `<div class="warn" style="margin-top:40px"><b>${MD_FILE}</b> 을 읽지 못했습니다 (${escAll(String(e.message || e))}).<br>
이 페이지는 내용 파일을 따로 불러오기 때문에, 파일을 더블클릭해서 열면(file://) 브라우저가 막습니다.<br>
VS Code의 Live Server로 열거나, 이 폴더에서 <code>npx serve</code> 를 실행하거나, GitHub Pages 주소로 열어 주세요.</div>`;
    console.error(e);
  }
})();
</script>
